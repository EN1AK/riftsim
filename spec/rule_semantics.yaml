# =============================================================================
# 阶段 1 手写语义层（机制级）
# 规则集版本：core-2026-07 zh canonical(source_009) + Vendetta Patch(source_019) + 勘误(<=source_010/020)
# 用法：scripts/spec/build_rules_spec.py 按 covers 将机制的 semantics 继承给每条规则，
#       与 DB 元数据（rule_id/topic/canonical/source）合并生成 spec/rules_spec.yaml。
# covers 语法："R-CR-A..R-CR-B" 为主编号闭区间（含全部子条款），单条写 "R-CR-A..R-CR-A"，
#              FRONT 写作 "R-CR-FRONT..R-CR-FRONT"。区间之间不得重叠，且须覆盖全部 R-CR。
# tier：MVP=首个可完结对局必需；P1=卡牌效果扩展前必需；P2=随卡牌覆盖按需启用；OUT=明确排除。
# status 由生成器按本层与 unresolved 清单推导（verified|ambiguous；R-CARD 另标 deferred）。
# =============================================================================
meta:
  schema: riftsim.rule_semantics/v1
  ruleset_version: core-2026-07-zh+patch-2026-07+errata-2026-07
  language: zh
  mvp_mode: "1v1 Duel (R-CR-485)"

mechanisms:
  # ================= 000 黄金/白银法则 =================
  - mechanism_id: MECH-GOLDEN-RULES
    title: 黄金法则（卡面优先）
    tier: MVP
    covers: ["R-CR-0..R-CR-2"]
    semantics:
      prerequisites: "卡牌印刷文字与规则文本对同一事项产生冲突。"
      legality: null
      transition: null
      timing: "任意冲突发生时即刻适用，不经结算链。"
      exceptions: []
      dependencies: ["MECH-CANT-BEATS-CAN"]
    test_hints: ["卡牌文本与核心规则冲突时以卡牌为准"]

  - mechanism_id: MECH-SILVER-RULES
    title: 白银法则（术语体系与自称）
    tier: MVP
    covers: ["R-CR-50..R-CR-53"]
    semantics:
      prerequisites: "解析卡面文字时适用。"
      legality: null
      transition: null
      timing: "效果文本解析期间。"
      exceptions: []
      dependencies: []
    notes:
      - "卡面与规则为两套术语体系，卡面文字按核心规则口径解读（051）。"
      - "效果中的「卡牌」是「主牌堆卡牌」简称（052）。"
      - "卡面第一人称「我」指代该游戏物体自身（053）。"
    test_hints: ["效果解析时第一人称绑定来源物体"]

  - mechanism_id: MECH-CANT-BEATS-CAN
    title: “无法”优先法则与尽可能执行
    tier: MVP
    covers: ["R-CR-54..R-CR-56"]
    semantics:
      prerequisites: "同一结算中出现「可以」与「无法」的冲突指示，或部分指示不可执行。"
      legality: "「无法」效力高于「可以」，无例外通道。"
      transition: "执行卡面文字时尽可能执行全部指示，忽略无法执行的指示（不因此回滚整个效果）（055）。"
      timing: "效果结算执行期间。"
      exceptions:
        - "区域归属修正：某玩家的卡牌不会进入其他玩家对应的非场地区域，改进入其所属者的对应区域（056）。"
      dependencies: []
    test_hints: ["敌方效果试图将我方牌放入其牌堆/手牌时改为回我方对应区域"]

  # ================= 100 游戏概念/组卡/Setup/区域 =================
  - mechanism_id: MECH-GAME-CONCEPTS
    title: 游戏概念（章标题）
    tier: MVP
    covers: ["R-CR-100..R-CR-100"]
    semantics:
      prerequisites: null
      legality: null
      transition: null
      timing: null
      exceptions: []
      dependencies: []
    notes: ["结构性条目，无独立行为语义。"]

  - mechanism_id: MECH-DECK-CONSTRUCTION
    title: 卡组构筑
    tier: MVP
    covers: ["R-CR-101..R-CR-103"]
    semantics:
      prerequisites: "对局开始前校验；卡组=传奇 1 张＋主牌堆≥40 张（含 1 张选定英雄）＋符文牌堆 12 张＋若干战场（数量按模式）。"
      legality:
        - "符文特性由传奇特性决定；单特性卡牌只可加入特性相同的卡组；多特性卡牌要求其全部特性都与卡组特性相同（103.1.b.3/4）。"
        - "选定英雄必须是英雄单位，且其英雄标签与传奇标签一致；游戏开始时置于英雄区域（103.2.a.1/2）。"
        - "主牌堆同名卡≤3 张（选定英雄计入名额）（103.2.b/103.2.b.1）。"
        - "与传奇同英雄标签的专属卡全卡组合计≤3 张，不计入同名上限（103.2.d）。"
        - "同名战场≤1 个（103.4.c）；需符合赛制合法性（103.2.e）。"
      transition: null
      timing: "reset() 之前的配置/合法性阶段；对局内不再校验。"
      exceptions:
        - "效果可允许任意特性卡牌入组，视为符合特性（103.1.b.5）。"
        - "[唯我]：同名限 1（825）；专属+唯我组合特例（825.3.b）。"
      dependencies: ["MECH-LEGENDS", "MECH-PRIVACY"]
    test_hints:
      - "多特性卡在单特性卡组中非法"
      - "选定英雄+2 张同名英雄合法，+3 张非法"
      - "专属卡 4 张非法"

  - mechanism_id: MECH-SETUP-OVERVIEW
    title: 准备游戏（引导）
    tier: MVP
    covers: ["R-CR-104..R-CR-104"]
    semantics:
      prerequisites: null
      legality: null
      transition: null
      timing: null
      exceptions: []
      dependencies: ["MECH-SETUP-PROCESS"]
    notes: ["引导性条目；具体步骤见 MECH-SETUP-PROCESS。"]

  - mechanism_id: MECH-SPACES
    title: 游戏空间
    tier: MVP
    covers: ["R-CR-105..R-CR-106"]
    semantics:
      prerequisites: "游戏区域是按卡牌行为与玩家关系划分的逻辑区域，可有物理或逻辑载体。"
      legality: "每个游戏物体在任意时刻恰好位于一个区域内（区域模型排他性）。"
      transition: "物体跨区域移动即区域成员关系变更；见 MECH-GAME-OBJECTS 的「新物体」规则。"
      timing: null
      exceptions: []
      dependencies: ["MECH-GAME-OBJECTS", "MECH-PRIVACY"]
    test_hints: ["同一物体不重叠存在于两个区域"]

  - mechanism_id: MECH-BOARD
    title: 场地（棋盘与盘内区域）
    tier: MVP
    covers: ["R-CR-107..R-CR-107"]
    semantics:
      prerequisites: "1v1 模式下：每玩家 1 个基地、2 个战场区域；战场由双方战场牌各随机选 1 产生（485）。"
      legality:
        - "基地：受其玩家控制的常驻牌和符文位于其中（107.1.c；召出符文落点=控制者基地）；基地/战场内容为公开信息（107.1.d/107.2.c）。"
        - "待命区：关联单战场的逻辑子区、容量 1（可增加/减少，107.3.b）、仅控制者可放入（107.3.c）、不是位置（107.3.e）、为公共区域但牌面朝下内容私密（107.3.f）；失控→下次清理移除该区全部牌（107.3.d）。"
        - "传奇区：非位置；传奇为游戏物体；卡组传奇不可被移除/移动（107.4.d）；加入的非卡组传奇另按 107.4.d.1/d.2。"
      transition: "常驻牌在盘内区域间的变化经由移动/打出/召回等行动完成；单位与装备等常驻牌置于基地或各战场区域；基地不属于战场。"
      timing: null
      exceptions: []
      dependencies: ["MECH-SPACES", "MECH-UNITS", "MECH-BATTLEFIELDS", "MECH-LOCATIONS"]
    test_hints: ["基地不可作为战场被争夺"]

  - mechanism_id: MECH-NONBOARD-ZONES
    title: 非场地区域
    tier: MVP
    covers: ["R-CR-108..R-CR-108"]
    semantics:
      prerequisites: "非场地区域清单：手牌、主牌堆、符文牌堆、废牌堆、放逐区、英雄区、结算链等（待命区/传奇区属盘内，见 107.3/107.4 与 MECH-BOARD）。"
      legality:
        - "结算链仅在有项目时存在（330）；链上卡牌与技能属公开信息。"
      transition: "牌堆/手牌/废牌堆/放逐区成员由抽牌、弃置、摧毁、放逐等行动变更。"
      timing: null
      exceptions: []
      dependencies: ["MECH-SPACES", "MECH-PRIVACY", "MECH-CHAINS", "MECH-KW-HIDDEN"]
    test_hints: ["待命区已有牌时不可再待命第二张（见 MECH-BOARD/MECH-KW-HIDDEN）"]

  - mechanism_id: MECH-BOARD-PUBLIC-INFO
    title: 盘内信息公开性
    tier: MVP
    covers: ["R-CR-109..R-CR-109"]
    semantics:
      prerequisites: "游戏物体位于共同游戏区域（场地）。"
      legality: "共同游戏区域中的所有游戏物体皆为公开信息。"
      transition: null
      timing: "observe() 依据；与 MECH-PRIVACY 共同决定可见性矩阵。"
      exceptions: ["待命状态牌面朝下为例外私密信息（811.6.a）。"]
      dependencies: ["MECH-PRIVACY"]
    test_hints: ["场上单位战力/休眠状态对双方可见"]

  - mechanism_id: MECH-SETUP-PROCESS
    title: 准备流程
    tier: MVP
    covers: ["R-CR-110..R-CR-118"]
    semantics:
      prerequisites: "卡组已通过 MECH-DECK-CONSTRUCTION 校验。"
      legality:
        - "调度：每玩家最多选 2 张手牌搁置→补抽等量→搁置卡回收（117）；1v1 模式后手玩家首个召出阶段额外召 1 符文（485 联动）。"
      transition:
        - "顺序：传奇入传奇区(111)→选定英雄入英雄区(112)→战场搁置备用(113)→主/符文牌堆分别洗牌入对应区域(114)→随机定回合顺序(115，循环队列)→各抽 4 张(116)→按回合序依次调度(117)→起始玩家开启首回合(118)。"
      timing: "对局开始、首个回合开始之前。"
      exceptions: []
      dependencies: ["MECH-DECK-CONSTRUCTION", "MECH-NONBOARD-ZONES", "MECH-ACT-DRAW", "MECH-ACT-RECYCLE", "MECH-MODE-DUEL"]
    test_hints:
      - "先/后手由 RNG 决定且可复现"
      - "调度 0/1/2 张的补抽与回收"

  - mechanism_id: MECH-GAME-OBJECTS
    title: 游戏物体
    tier: MVP
    covers: ["R-CR-119..R-CR-124"]
    semantics:
      prerequisites: "游戏物体=能产生效果或作为行动前提的实体/逻辑体；枚举含卡牌、符文、传奇、战场、指示物、技能、结算链项目等。"
      legality: "物体跨区域（至非场地区域或反向）后成为一个新物体，此前作用于它的效果通常不再适用（124，例外按其条款）。"
      transition: "区域迁移→新物体身份；同区域内移动保持身份。"
      timing: "任何区域迁移完成时。"
      exceptions: ["124 子条款列明的身份保持例外。"]
      dependencies: ["MECH-SPACES"]
    test_hints: ["单位从战场进废牌堆后，其增益/伤害/持续效果不再附着"]

  # ================= 125-139 卡牌与卡面属性 =================
  - mechanism_id: MECH-CARDS
    title: 卡牌总述
    tier: MVP
    covers: ["R-CR-125..R-CR-126"]
    semantics:
      prerequisites: null
      legality: null
      transition: null
      timing: null
      exceptions: []
      dependencies: []
    notes: ["定义性条目。"]

  - mechanism_id: MECH-OWNERSHIP
    title: 所属权
    tier: MVP
    covers: ["R-CR-127..R-CR-127"]
    semantics:
      prerequisites: "每张卡牌的所属者=构筑时将其带入对局的玩家。"
      legality: "所属权在对局中不可变更（控制权可变，所属权不变）。"
      transition: null
      timing: null
      exceptions: []
      dependencies: ["MECH-CONTROL", "MECH-CANT-BEATS-CAN"]
    test_hints: ["对手获得我方单位控制权后其离场仍回我方废牌堆"]

  - mechanism_id: MECH-PRIVACY
    title: 隐私（信息可见性三级）
    tier: MVP
    covers: ["R-CR-128..R-CR-128"]
    semantics:
      prerequisites: "区域与物体按规则分为公开/私密/隐秘。"
      legality:
        - "公开：所有玩家可见（场地、废牌堆、放逐区内容、结算链上的卡牌与技能等；链上项目公开见 108 子条款锚点）。"
        - "私密：仅其持有者可查看（自己手牌、自己待命牌）。"
        - "隐秘：任何玩家不可知（牌堆顺序、对手手牌内容）。"
      transition: "物体进入不同隐私级区域时可见性随之变化；展示动作可临时公开。"
      timing: "observe()/legal_actions/公开 trace 的统一过滤依据。"
      exceptions: ["待命牌的[反应]属性不属于公开信息（811.6.a）。"]
      dependencies: ["MECH-SPACES", "MECH-BOARD-PUBLIC-INFO"]
    test_hints: ["对手手牌数量可见、内容不可见；牌库顶不可见"]

  - mechanism_id: MECH-CARD-FACES
    title: 卡背与卡面
    tier: MVP
    covers: ["R-CR-129..R-CR-130"]
    semantics:
      prerequisites: "卡牌双面：卡背统一；卡面载全部游戏属性。"
      legality: "牌面朝下时对手仅可见卡背（待命/牌堆）。"
      transition: null
      timing: null
      exceptions: []
      dependencies: ["MECH-PRIVACY"]
    test_hints: ["待命牌对对手呈现为卡背"]

  - mechanism_id: MECH-COST-ATTRIBUTE
    title: 卡面费用属性
    tier: MVP
    covers: ["R-CR-131..R-CR-131"]
    semantics:
      prerequisites: "卡牌印刷费用=法力数值＋符能需求（特性符号集合）。"
      legality: "判定卡牌费用一律以印刷（或被复制的）费用为准（206 联动）。"
      transition: null
      timing: "打出流程步骤 3 定总费的输入（356）。"
      exceptions: []
      dependencies: ["MECH-PLAY-STEP3-COST", "MECH-COSTS", "MECH-DOMAIN"]
    test_hints: ["印有 [2][R][R] 的卡需 2 点任意法力+2 点炽烈符能"]

  - mechanism_id: MECH-NAME
    title: 名称
    tier: MVP
    covers: ["R-CR-132..R-CR-132"]
    semantics:
      prerequisites: "名称是卡牌身份属性，组卡上限与选定英雄判定的键。"
      legality: "同角色不同名称视为不同卡（103.2.b.2）。"
      transition: null
      timing: null
      exceptions: []
      dependencies: ["MECH-DECK-CONSTRUCTION"]
    test_hints: ["「亚索-迷途怅惘」与「亚索-乘风归」各占同名名额"]

  - mechanism_id: MECH-CATEGORY
    title: 类别（超类型/类型/标签）
    tier: MVP
    covers: ["R-CR-133..R-CR-133"]
    semantics:
      prerequisites: "类别=超类型＋类型（单位/装备/法术/符文/传奇/战场）＋标签（英雄/[武装]/[专属]等）。"
      legality: "类型决定该卡适用的行为规则（打出目的地、结算去向等）。"
      transition: "效果可在效果层第 1 层改变特质（含类别）（477.1）。"
      timing: null
      exceptions: []
      dependencies: ["MECH-GAME-OBJECTS", "MECH-LAYERS-ORDER"]
    test_hints: ["[武装]标签使装备可用[装配]"]

  - mechanism_id: MECH-DOMAIN
    title: 特性（领域）
    tier: MVP
    covers: ["R-CR-134..R-CR-134"]
    semantics:
      prerequisites: "特性枚举：[R][G][B][O][P][Y] 六色；[A]表任意特性；[C]表该牌自身的特性。"
      legality: "符能支付必须特性匹配；匹配规则按 [A]/[C] 语义展开。"
      transition: null
      timing: "费用判定与支付时（356/357）。"
      exceptions: []
      dependencies: ["MECH-RUNE-POOLS", "MECH-COST-ATTRIBUTE"]
    test_hints: ["无特性卡的 [C] 符能费可用任意特性支付（805.1.a.2 同口径）"]

  - mechanism_id: MECH-RULES-TEXT
    title: 规则文本
    tier: MVP
    covers: ["R-CR-135..R-CR-135"]
    semantics:
      prerequisites: "规则文本=关键词、技能、符号的组合；符号含 [E]（休眠费用）、[M]（战力）、[>]（关键词-技能链接）等。"
      legality: "执行顺序为文本自上而下（803）。"
      transition: null
      timing: null
      exceptions: []
      dependencies: ["MECH-KEYWORDS-GENERAL", "MECH-ABILITIES-OVERVIEW"]
    test_hints: ["同卡多技能按印刷顺序结算"]

  - mechanism_id: MECH-EFFECT-TEXT
    title: 效果文本
    tier: MVP
    covers: ["R-CR-136..R-CR-136"]
    semantics:
      prerequisites: "效果文本是贴附机制相关文本；与规则文本区分（724：未贴附时处于未激活）。"
      legality: null
      transition: "贴附完成→效果文本激活并入顶部卡牌（719.2 联动）。"
      timing: "贴附/卸除行动完成时。"
      exceptions: []
      dependencies: ["MECH-ATTACHMENT", "MECH-INACTIVE"]
    test_hints: ["未贴附装备的效果文本对游戏无影响"]

  - mechanism_id: MECH-MIGHT-BONUS
    title: 战力加成
    tier: MVP
    covers: ["R-CR-137..R-CR-137"]
    semantics:
      prerequisites: "装备卡面可印刷战力加成（+N[M]）。"
      legality: null
      transition: "贴附生效期间在效果层第 3 层加算于顶部卡战力（477.3.d）。"
      timing: "效果层应用时。"
      exceptions: []
      dependencies: ["MECH-ATTACHMENT", "MECH-LAYERS-ORDER"]
    test_hints: ["卸除后加成立即消失"]

  - mechanism_id: MECH-FLAVOR-ILLUSTRATION
    title: 趣味性文本与插画
    tier: MVP
    covers: ["R-CR-138..R-CR-139"]
    semantics:
      prerequisites: null
      legality: null
      transition: null
      timing: null
      exceptions: []
      dependencies: []
    notes: ["无游戏语义；引擎不建模。"]

  # ================= 140-159 单位/装备/法术 =================
  - mechanism_id: MECH-UNITS
    title: 单位
    tier: MVP
    covers: ["R-CR-140..R-CR-146"]
    semantics:
      prerequisites: "单位=主牌堆卡牌类型之一；自有属性含战力[M]、伤害标记、位置；[E]费用可用。"
      legality:
        - "打出时默认以休眠状态进场（359；[急速]等可替换为活跃）。"
        - "单位主动技能仅可在其控制者回合的主阶段且开环时激活（145.2）。"
        - "标准移动是全体单位的自有技能（144）。"
      transition: "伤害以标记数值累积于单位；伤害≥战力即致命（143；清理 3b 摧毁）；战力可被效果改变。"
      timing: null
      exceptions: []
      dependencies: ["MECH-CATEGORY", "MECH-ACT-DEAL", "MECH-CLEANUPS", "MECH-MOVEMENT"]
    test_hints:
      - "伤害在回合结束清理 3c 移除"
      - "战力被减至与累积伤害相等时下次清理被摧毁"

  - mechanism_id: MECH-GEAR
    title: 装备
    tier: MVP
    covers: ["R-CR-147..R-CR-152"]
    semantics:
