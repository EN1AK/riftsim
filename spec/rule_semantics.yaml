  # ================= 318-348 清理/链/FEPR/对决 =================
  - mechanism_id: MECH-CLEANUPS
    title: 清理
    tier: MVP
    covers: ["R-CR-318..R-CR-324"]
    semantics:
      prerequisites: "解锁条件（319.1-8 完整枚举）：①开环/闭环转换后；②阶段转换后；③待处理项目入链后；④项目变为已确认后；⑤链上项目被移除后；⑥任意物体进入或离开场地后；⑦任意物体状态改变后；⑧移动完成后。"
      legality: "清理进行中不确认/结算链项目（320）；结算链项目结算期间不发生清理（321，相关清理变未决）。"
      transition: "按序执行 14 项（规则号↔项号：323.1=1 胜利检查；323.2=2 确立攻防身份；323.3=3 未决场地状态；323.4=3a 绝念触发入链；323.5=3b 致命伤害摧毁；323.6=4 失控；323.7=5 召回错位物体含待命牌处理；323.8=6 争夺→对决待发生；323.9=7 战斗待发生；323.10=7a 取消战斗待发生；323.11=8 移除失效争夺；323.12=9 回合玩家选场开对决；323.13=10 选场开战斗；323.14=10a 对决转战斗对决）。期间新满足清理条件→本次清理完成后立即再清一次（322）。"
      timing: "满足解锁条件且不在 320/321 抑制窗口时。"
      exceptions: ["特殊清理（324）在回合结束/战斗结算等指定时点附加额外操作。"]
      dependencies: ["MECH-WINNING", "MECH-ACT-KILL", "MECH-SHOWDOWNS", "MECH-COMBAT", "MECH-CONTROL"]
    test_hints:
      - "清理链路反应：3b 摧毁触发绝念→FEPR→再清理"
      - "结算中产生的死亡在下一次清理统一处理"

  - mechanism_id: MECH-CHAINS
    title: 结算链
    tier: MVP
    covers: ["R-CR-325..R-CR-331"]
    semantics:
      prerequisites: "玩家打出卡牌或激活技能→创建结算链并放入首个待处理项目（328/329）。"
      legality: "链存在期间回合为闭环（331）；行动窗口见 326。"
      transition: "项目状态迁移：待处理→已确认→结算完成；链空即消失（330）。"
      timing: null
      exceptions: []
      dependencies: ["MECH-TURN-STATES", "MECH-TASKS-FEPR"]
    test_hints: ["链清空瞬间四态标志复位"]

  - mechanism_id: MECH-TASKS-FEPR
    title: 任务与 HOT FEPR 流程
    tier: MVP
    covers: ["R-CR-332..R-CR-336"]
